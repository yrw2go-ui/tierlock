name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # One signing key, kept in GitHub's cache (never in the repo), so each new
      # APK installs over the last one. The first build on main creates it.
      - name: Restore signing key
        id: key
        uses: actions/cache@v4
        with:
          path: ~/.tierlock-keystore
          key: tierlock-signing-key-v1

      - name: Create signing key
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.tierlock-keystore
          openssl rand -hex 24 > ~/.tierlock-keystore/password
          keytool -genkeypair -keystore ~/.tierlock-keystore/tierlock.keystore \
            -storepass "$(cat ~/.tierlock-keystore/password)" -keypass "$(cat ~/.tierlock-keystore/password)" \
            -alias tierlock -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tierlock"

      - name: Build APK
        run: |
          export TIERLOCK_KEYSTORE="$HOME/.tierlock-keystore/tierlock.keystore"
          export TIERLOCK_KEYSTORE_PASSWORD="$(cat ~/.tierlock-keystore/password)"
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk tierlock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tierlock-apk
          path: android/tierlock.apk

      - name: Publish the latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest tierlock.apk --prerelease \
            --title "Tierlock for Android (latest test build)" \
            --notes "Built from ${GITHUB_SHA::7}. On the Android phone or tablet, download tierlock.apk and open it to install (allow installs from your browser if asked)."
